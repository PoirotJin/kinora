user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /var/log/nginx/motionfarm-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format motionfarm '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/motionfarm-access.log motionfarm;
    sendfile on;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    reset_timedout_connection on;
    limit_req_zone $binary_remote_addr zone=mf_api:1m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=mf_login:1m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=mf_connections:1m;
    limit_conn_zone $binary_remote_addr zone=mf_downloads:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 8765 ssl;
        server_name your-kinora.example.com;
        ssl_certificate /etc/letsencrypt/live/motionfarm-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/motionfarm-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:mf_tls:2m;
        ssl_session_timeout 10m;
        limit_conn mf_connections 32;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 90s;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_hide_header Server;
        location ~ "^/api/harness/personal-assets/(inspect-bvh|import-bvh|rigs|objects)$" {
            client_max_body_size 12m;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location = /api/harness/video-motion {
            client_max_body_size 45m;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/(?:harness/robots|gadget/v1/robot_import)$" {
            client_max_body_size 45m;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/(?:gadget/v1/(?:import|harness_import)|harness/tasks/[A-Za-z0-9_-]{1,96}/import-patch)$" {
            client_max_body_size 17m;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location = /api/harness/scene {
            client_max_body_size 96k;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/(?:custom|harness/robot-edits/[0-9a-f]{32}/edit|gadget/v1/(?:robot_edit_apply|harness_step))$" {
            client_max_body_size 96k;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/(?:harness/(?:tasks(?:/[A-Za-z0-9_-]{1,96}/(?:repair|feedback))?|robot-edits|robots/robot_[0-9a-f]{32}/profiles)|personal/presets|gadget/v1/harness_(?:create|feedback))$" {
            client_max_body_size 32k;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location = /api/harness/multi-scene {
            client_max_body_size 128k;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location = /api/harness/object-response {
            client_max_body_size 64k;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location = /api/auth/login {
            limit_req zone=mf_login burst=5 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/harness/robot-edits/[0-9a-f]{32}/import-repair$" {
            client_max_body_size 17m;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
        location ~ "^/api/(?:storage/(?:download|archive)|retarget/(?:download|repair-download)|(?:harness|library)/export|harness/(?:motions/[A-Za-z0-9_-]{1,96}|robot-edits/[0-9a-f]{32}|personal-assets/snapshots/[0-9a-f]{32})/download|gadget/v1/(?:download|source))$" {
            limit_conn mf_downloads 2;
            proxy_buffering off;
            proxy_read_timeout 90s;
            limit_rate 32m;
            proxy_pass http://127.0.0.1:18767;
        }
        location / {
            limit_req zone=mf_api burst=120 nodelay;
            proxy_pass http://127.0.0.1:18765;
        }
    }
}
