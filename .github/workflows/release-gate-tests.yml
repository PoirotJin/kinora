name: Release gate checks
on:
  push:
    paths: ['tools/**', '.github/workflows/publish-desktop.yml', '.github/workflows/release-gate-tests.yml']
  pull_request:
    paths: ['tools/**', '.github/workflows/publish-desktop.yml', '.github/workflows/release-gate-tests.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: PoirotJin/kinora
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tools/install_release_tools.sh
      - run: python3 -m unittest discover -s tools -p 'test_release_*.py'
      - name: Verify real signed installers and update packages without publishing
        if: github.event_name == 'push'
        env:
          KINORA_BLOCKED_IPS: ${{ secrets.KINORA_BLOCKED_IPS }}
        run: |
          mkdir fixture sources
          gh release download kinora-v0.9.0 -p 'kinora_0.9.0_*' -p 'kinora-0.9.0-*' -D fixture
          gh release download kinora-server-v0.5.2 -p 'kinora-server-0.5.2.zip' -D sources
          gh release download kinora-v0.5.1 -p 'kinora-gadget-0.15.2.zip' -D sources
          cp tools/fixtures/renderer-0.9.0.json fixture/renderer-assets.json
          (cd fixture && zip -q -0 ../candidate.zip *)
          digest=$(sha256sum candidate.zip | cut -d ' ' -f 1)
          python3 tools/prepare_release.py 0.9.0 candidate.zip "$digest" verified sources/*.zip
