name: Publish server beta
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version, e.g. 1.0.0-beta.2'
        required: true
      candidate_draft:
        description: 'Private kinora-staging-<version>-server draft release ID'
        required: true
      candidate_sha256:
        description: 'SHA-256 of kinora-server-<version>.zip'
        required: true
permissions:
  contents: read
concurrency:
  group: kinora-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'PoirotJin/kinora' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: kinora-release-signing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.candidate_draft }}
      CHECKSUM: ${{ inputs.candidate_sha256 }}
      TARGET: ${{ github.sha }}
      KINORA_BLOCKED_IPS: ${{ secrets.KINORA_BLOCKED_IPS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact private candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta(\.[1-9][0-9]*)?$ ]]
          [[ "$DRAFT" =~ ^[0-9]+$ && "$CHECKSUM" =~ ^[a-f0-9]{64}$ ]]
          mkdir dist
          package="kinora-server-${VERSION}.zip"
          gh api "repos/$GH_REPO/releases/$DRAFT" > draft.json
          jq -e --arg tag "kinora-staging-$VERSION-server" '.draft == true and .tag_name == $tag' draft.json >/dev/null
          asset=$(jq -er --arg name "$package" --arg digest "sha256:$CHECKSUM" \
            '.assets | select(length == 1) | .[0] | select(.name == $name and .state == "uploaded" and .digest == $digest) | .id' draft.json)
          gh api "repos/$GH_REPO/releases/assets/$asset" -H 'Accept: application/octet-stream' > "dist/$package"
          printf '%s  dist/%s\n' "$CHECKSUM" "$package" | sha256sum --check --status
      - name: Install disclosure inspection tools
        run: bash tools/install_release_tools.sh
      - name: Test release protection
        run: python3 -m unittest discover -s tools -p 'test_release_*.py'
      - name: Inspect the server source archive
        shell: bash
        run: |
          set -euo pipefail
          package="kinora-server-${VERSION}.zip"
          python3 - "dist/$package" "$VERSION" <<'PY'
          import json
          import sys
          import zipfile

          path, version = sys.argv[1], sys.argv[2]
          prefix = f'kinora-server-{version}/'
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if prefix + 'VERSION' not in names or prefix + 'SOURCE_MANIFEST.json' not in names:
                  raise SystemExit('Missing VERSION or SOURCE_MANIFEST.json in server archive')
              if archive.read(prefix + 'VERSION').decode().strip() != version:
                  raise SystemExit('Server archive VERSION mismatch')
              manifest = json.loads(archive.read(prefix + 'SOURCE_MANIFEST.json'))
              if manifest.get('version') != version:
                  raise SystemExit('SOURCE_MANIFEST.json version mismatch')
          PY
          printf 'Kinora %s · Server Beta\n' "$VERSION" > release-title.txt
          cat > release-notes.txt <<'EOF'
          Sanitized server source prerelease for self-hosting Kinora, including Gadget and the prebuilt web Gadget archive. Model weights, robot meshes, production databases, and credentials are excluded.

          Follow `docs/SERVER.md` and `docs/SELF_HOSTING.md` to configure your environment, download external assets, and deploy the HTTP/HTTPS service.
          EOF
          python3 tools/release_gate.py "dist/$package" release-title.txt release-notes.txt
          (cd dist && sha256sum "$package" > SHA256SUMS.txt)
      - name: Create draft with verified assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "kinora-v$VERSION-server" dist/* --draft --prerelease --target "$TARGET" \
            --title "$(cat release-title.txt)" --notes-file release-notes.txt
          id=""
          for attempt in 1 2 3 4 5; do
            if id=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp \
              | jq -er --arg tag "kinora-v$VERSION-server" --arg target "$TARGET" \
                '[.[][] | select(.draft == true and .tag_name == $tag and .target_commitish == $target)] | select(length == 1) | .[0].id'); then
              break
            fi
            sleep 3
          done
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Sign the existing trusted gate record
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          KINORA_RELEASE_RECORD_KEY: ${{ secrets.KINORA_RELEASE_RECORD_KEY }}
        run: python3 tools/release_record.py dist "$GH_REPO" "$VERSION" "$RELEASE_ID" "$TARGET" --platform server
      - name: Verify GitHub attachments and publish immutable prerelease
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "kinora-v$VERSION-server" dist/KINORA-RELEASE-GATE.json dist/KINORA-RELEASE-GATE.json.sig
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > remote-assets.json
          python3 tools/verify_release_draft.py dist remote-assets.json
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" -X PATCH -F draft=false -F prerelease=true -f make_latest=false \
            | jq -e '.draft == false and .prerelease == true and .immutable == true'
