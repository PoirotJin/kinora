name: Publish desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version, e.g. 0.10.0'
        required: true
      candidate_artifact:
        description: 'Private MotionFarm Actions artifact ID (requires KINORA_BUILD_READ_TOKEN)'
        required: false
      candidate_url:
        description: 'Alternative HTTPS URL for the exact release-candidate ZIP'
        required: false
      candidate_sha256:
        description: 'SHA-256 of the Actions ZIP from the private build summary'
        required: true
      server_from:
        description: 'Public release containing the server source ZIP to carry forward'
        default: kinora-server-v0.5.2
        required: true
      gadget_from:
        description: 'Public release containing the Gadget source ZIP to carry forward'
        default: kinora-v0.5.1
        required: true
      server_zip_url:
        description: 'Optional HTTPS URL for a new server source ZIP, instead of carry-forward'
        required: false
      gadget_zip_url:
        description: 'Optional HTTPS URL for a new Gadget source ZIP, instead of carry-forward'
        required: false
      verify_only:
        description: 'Stop after validating the complete release candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kinora-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      SERVER_FROM: ${{ inputs.server_from }}
      GADGET_FROM: ${{ inputs.gadget_from }}
      SERVER_URL: ${{ inputs.server_zip_url }}
      GADGET_URL: ${{ inputs.gadget_zip_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the candidate and source archives
        env:
          BUILD_READ_TOKEN: ${{ secrets.KINORA_BUILD_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          CANDIDATE_SHA256=${CANDIDATE_SHA256#sha256:}
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir sources
          download() {
            [[ "$1" == https://* ]]
            curl --fail --silent --location --retry 2 --max-time 120 --max-filesize 268435456 \
              --proto '=https' --proto-redir '=https' --url "$1" --output "$2"
          }
          source_zip() {
            local url=$1 tag=$2 kind=$3 filename
            if [ -z "$url" ]; then
              [[ "$tag" =~ ^kinora-(server-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              gh release download "$tag" -p "kinora-$kind-[0-9]*.zip" -D sources
            else
              filename=${url%%\?*}
              filename=${filename##*/}
              [[ "$filename" =~ ^kinora-$kind-[0-9]+\.[0-9]+\.[0-9]+\.zip$ ]]
              download "$url" "sources/$filename"
            fi
          }
          if [ -n "$CANDIDATE_ARTIFACT" ]; then
            [[ -z "$CANDIDATE_URL" && "$CANDIDATE_ARTIFACT" =~ ^[0-9]+$ && -n "$BUILD_READ_TOKEN" ]]
            GH_TOKEN="$BUILD_READ_TOKEN" gh api               "repos/PoirotJin/MotionFarm/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > candidate.zip
          else
            [[ -n "$CANDIDATE_URL" ]]
            download "$CANDIDATE_URL" candidate.zip
          fi
          unset BUILD_READ_TOKEN
          echo "CANDIDATE_SHA256=$CANDIDATE_SHA256" >> "$GITHUB_ENV"
          source_zip "$SERVER_URL" "$SERVER_FROM" server
          source_zip "$GADGET_URL" "$GADGET_FROM" gadget
      - name: Install release inspection tools
        run: bash tools/install_release_tools.sh
      - name: Test the release gate
        run: python3 -m unittest discover -s tools -p 'test_release_*.py'
      - name: Unpack and gate all release assets
        env:
          KINORA_BLOCKED_IPS: ${{ secrets.KINORA_BLOCKED_IPS }}
        run: python3 tools/prepare_release.py "$VERSION" candidate.zip "$CANDIDATE_SHA256" dist sources/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-assets
          path: dist/
          if-no-files-found: error
          retention-days: 3
  publish:
    if: ${{ !inputs.verify_only && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: kinora-release-signing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-public-assets
          path: dist
      - name: Create a private draft from the verified assets
        id: draft
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          python3 - "$latest" "$VERSION" <<'PY'
          import re, sys
          def version(value):
              match = re.fullmatch(r'(?:kinora-v)?([0-9]+)\.([0-9]+)\.([0-9]+)', value)
              if not match:
                  raise SystemExit('Unexpected release version')
              return tuple(map(int, match.groups()))
          if not version(sys.argv[1]) < version(sys.argv[2]):
              raise SystemExit('The GitHub updater requires a higher version')
          PY
          tag="kinora-v$VERSION"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            | jq -e --arg ref "refs/tags/$tag" 'all(.[]; .ref != $ref)' >/dev/null
          gh release create "$tag" dist/* --draft --target "$TARGET" \
            --title "Kinora $VERSION" --notes "首次启动请填写你的 Kinora 服务地址。应用内更新由此 GitHub 仓库提供。"
          draft=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp \
            | jq -er --arg tag "$tag" --arg target "$TARGET" \
              '[.[][] | select(.tag_name == $tag and .target_commitish == $target and .draft)] | select(length == 1) | .[0].id')
          echo "id=$draft" >> "$GITHUB_OUTPUT"
      - name: Sign the release gate record
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
          KINORA_RELEASE_RECORD_KEY: ${{ secrets.KINORA_RELEASE_RECORD_KEY }}
        run: python3 tools/release_record.py dist "$GH_REPO" "$VERSION" "$DRAFT_ID" "$TARGET"
      - name: Publish the verified release and GitHub updater feed
        env:
          DRAFT_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh release upload "kinora-v$VERSION" dist/KINORA-RELEASE-GATE.json dist/KINORA-RELEASE-GATE.json.sig
          gh api "repos/$GH_REPO/releases/$DRAFT_ID/assets?per_page=100" --paginate --slurp \
            | jq 'add' > draft-assets.json
          python3 tools/verify_release_draft.py dist draft-assets.json
          gh api "repos/$GH_REPO/releases/$DRAFT_ID" -X PATCH -F draft=false -f make_latest=true \
            | jq -e '.draft == false and .immutable == true'
