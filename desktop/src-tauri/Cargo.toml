[package]
name = "motionfarm-desktop"
version = "1.0.1"
description = "kinora desktop motion workspace"
edition = "2021"
publish = false

[lib]
name = "motionfarm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
open = "5"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util"] }
# native-tls uses the operating system trust store (SChannel / Security.framework /
# OpenSSL), so a privately installed MotionFarm CA is honoured. TLS is never disabled.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSObjCRuntime", "NSString", "NSUserDefaults", "NSValue"] }
plist = "1"
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
