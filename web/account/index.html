<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>账号 · kinora</title>
  <link rel="stylesheet" href="/account/account.css">
  <script src="/account/account.js" defer></script>
</head>
<body>
  <header><a class="wordmark" href="/account?view=register" aria-label="kinora 账号首页">kinora</a><span class="eyebrow">账号</span></header>
  <main>
    <section class="intro"><span class="eyebrow">kinora ACCOUNT</span><h1 id="heading">申请账号</h1><p id="description">提交申请，管理员审批通过后即可登录，无需邮箱验证。</p></section>
    <section class="panel" aria-labelledby="heading">
      <nav aria-label="账号操作"><a href="?view=register" data-view="register">申请账号</a><a href="?view=progress" data-view="progress">申请进度</a><a href="?view=forgot" data-view="forgot">找回密码</a></nav>
      <p id="service-note" class="notice" role="status" hidden></p>
      <form id="account-form">
        <label class="field" id="name-field"><span>姓名 / 称呼</span><input name="display_name" maxlength="80" autocomplete="name" required></label>
        <label class="field" id="reason-field"><span>申请说明（团队及用途）</span><input name="reason" maxlength="500" required></label>
        <label class="field" id="email-field" hidden><span>电子邮箱</span><input name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <label class="field" id="username-field"><span>用户名</span><input name="username" autocomplete="username" minlength="1" maxlength="40" pattern="[A-Za-z0-9_.\-]{1,40}" required><small>1–40 位字母、数字、点、下划线或短横线</small></label>
        <label class="field" id="password-field"><span>密码</span><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><small>至少 12 个字符</small></label>
        <label class="field" id="confirm-field"><span>确认密码</span><input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
        <p id="error" role="alert"></p>
        <button type="submit" id="submit">提交申请</button>
      </form>
      <div id="success" role="status" hidden><h2 id="success-title"></h2><p id="success-detail"></p><a id="again" href="?view=register">重新发送</a></div>
      <p class="footnote" id="footnote">无需邮箱。请保留申请时的用户名和密码；管理员通过后即可登录。</p>
    </section>
  </main>
  <footer><span>kinora</span><span>账号申请与密码重置在此网页完成</span></footer>
</body>
</html>
